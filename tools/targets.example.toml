# Copy this file to tools/targets.toml. The local file is ignored by Git.
# Use absolute identity_file paths; private keys must never be committed.

[targets.bloom-plus]
host = "192.0.2.10"
user = "root"
port = 22
identity_file = "/home/you/.ssh/bloom_plus"
# Optional dedicated pin store. host_key_alias lets one SD-card host key remain
# pinned while the card moves between devices or its DHCP address changes.
# known_hosts_file = "/home/you/.ssh/bloom_known_hosts"
# host_key_alias = "bloom-test-card"
expected_model = "mini_plus"

[targets.bloom-flip]
host = "192.0.2.11"
user = "root"
port = 22
identity_file = "/home/you/.ssh/bloom_flip"
expected_model = "mini_flip"
