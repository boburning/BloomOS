name: Tagged release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  tagged-release:
    name: Tagged release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    - name: Trust checked-out repository
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Get version
      run: |
        TAG="${{ github.ref_name }}"
        echo "BUILD_VERSION=${TAG#v}" >> $GITHUB_ENV
    - name: Build unsigned release
      run: |
        docker run --rm \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --workdir /workspace \
          aemiii91/miyoomini-toolchain@sha256:e5123590ad75d27f0f4c91196e3119a255cad45f3ae15243e29a8e0a2ec50132 \
          bash -lc 'git config --global --add safe.directory /workspace; git submodule foreach --recursive '\''git config --global --add safe.directory "$toplevel/$sm_path"'\''; source /root/.bashrc; VERSION_OVERRIDE="${{ env.BUILD_VERSION }}" CHANNEL=stable make unsigned-release'
        sudo chown -R "$(id -u):$(id -g)" release
    - name: Configure release signing
      env:
        BLOOM_RELEASE_SIGNING_KEY: ${{ secrets.BLOOM_RELEASE_SIGNING_KEY }}
      run: |
        test -n "$BLOOM_RELEASE_SIGNING_KEY"
        umask 077
        printf '%s\n' "$BLOOM_RELEASE_SIGNING_KEY" > /tmp/bloom-release-signing-key.pem
        echo "BLOOM_RELEASE_SIGNING_KEY_FILE=/tmp/bloom-release-signing-key.pem" >> $GITHUB_ENV
    - name: Sign release
      run: VERSION_OVERRIDE="${{ env.BUILD_VERSION }}" make sign-release
    - name: Remove release signing key
      if: always()
      run: rm -f /tmp/bloom-release-signing-key.pem
    - uses: marvinpinto/action-automatic-releases@d68defdd11f9dcc7f52f35c1b7c236ee7513bcc1 # latest resolved 2026-08-15
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: false
        draft: true
        title: "BloomOS v${{ env.BUILD_VERSION }}"
        files: |
          release/${{ env.BUILD_VERSION }}/*
