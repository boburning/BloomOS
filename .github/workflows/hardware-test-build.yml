name: Hardware test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build hardware test image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Resolve submodule cache key
        id: submodules
        shell: bash
        run: echo "sha=$(git ls-files --stage | awk '$1 == 160000 { print $2, $4 }' | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore submodule object cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: .git/modules
          key: submodules-${{ runner.os }}-${{ steps.submodules.outputs.sha }}
      - name: Checkout pinned submodules
        run: tools/checkout-submodules.sh
      - name: Get version
        run: |
          short_sha="${GITHUB_SHA::8}"
          echo "BUILD_VERSION=0.1.0-dev-${short_sha}" >> $GITHUB_ENV
      - name: Build unsigned test release
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            aemiii91/miyoomini-toolchain@sha256:e5123590ad75d27f0f4c91196e3119a255cad45f3ae15243e29a8e0a2ec50132 \
            bash -lc 'git config --global --add safe.directory /workspace; git submodule foreach --recursive '\''git config --global --add safe.directory "$toplevel/$sm_path"'\''; source /root/.bashrc; VERSION_OVERRIDE="${{ env.BUILD_VERSION }}" CHANNEL=development make unsigned-release'
          sudo chown -R "$(id -u):$(id -g)" release
      - name: Configure release signing
        env:
          BLOOM_RELEASE_SIGNING_KEY: ${{ secrets.BLOOM_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$BLOOM_RELEASE_SIGNING_KEY"
          umask 077
          printf '%s\n' "$BLOOM_RELEASE_SIGNING_KEY" > /tmp/bloom-release-signing-key.pem
          echo "BLOOM_RELEASE_SIGNING_KEY_FILE=/tmp/bloom-release-signing-key.pem" >> $GITHUB_ENV
      - name: Sign test release
        run: VERSION_OVERRIDE="${{ env.BUILD_VERSION }}" make sign-release
      - name: Remove release signing key
        if: always()
        run: rm -f /tmp/bloom-release-signing-key.pem
      - name: Upload test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bloom-os-hardware-test-${{ github.sha }}
          path: |
            release/${{ env.BUILD_VERSION }}/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
