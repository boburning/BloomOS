name: RetroAchievements release gate

on:
  pull_request:
    paths:
      - '.github/workflows/ra-gate.yml'
      - 'build/ra-core-policy.json'
      - 'build/core-manifest.json'
      - 'build/dependencies.lock'
      - 'build/raofflineproxy/**'
      - 'build/rhash/**'
      - 'src/bloomLaunch/**'
      - 'src/bloomRa/**'
      - 'src/bloomRaProxy/**'
      - 'src/bloomRaTest/**'
      - 'test/**ra**'
      - 'tools/validate_ra*'
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release-sensitive RA contracts
        run: python3 tools/validate_ra_release_gate.py
