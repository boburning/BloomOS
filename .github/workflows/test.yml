name: Test build
on:
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - '.gitmodules'
      - 'Makefile'
      - 'src/**/Makefile'
      - 'src/**/*.c'
      - 'src/**/*.h'
      - 'src/**/*.cpp'
      - 'src/**/*.hpp'
      - 'test/Makefile'
      - 'test/**/*.c'
      - 'test/**/*.h'
      - 'test/**/*.cpp'
      - 'test/**/*.hpp'
      - 'third-party/**'
      - 'tools/ci-scope.sh'
      - 'test/test_ci_scope.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test build
    runs-on: ubuntu-latest

    steps:
    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes build-essential cppcheck libgtest-dev libsdl1.2-dev libsdl-image1.2-dev libsdl-ttf2.0-dev
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
    - name: Resolve submodule cache key
      id: submodules
      shell: bash
      run: echo "sha=$(git ls-files --stage third-party/rcheevos third-party/zlib | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - name: Restore submodule object cache
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          .git/modules/third-party/rcheevos
          .git/modules/third-party/zlib
        key: test-submodules-${{ runner.os }}-${{ steps.submodules.outputs.sha }}
    - name: Checkout pinned test submodules
      run: tools/checkout-submodules.sh third-party/rcheevos third-party/zlib
    - name: Test CI scope policy
      run: sh test/test_ci_scope.sh
    - name: Resolve static-analysis scope
      id: scope
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: echo "targets=$(git diff --name-only "$BASE_SHA"...HEAD | sh tools/ci-scope.sh static-analysis)" >> "$GITHUB_OUTPUT"
    - name: Run static analysis
      run: |
        targets='${{ steps.scope.outputs.targets }}'
        if [ "$targets" = full ]; then
          make static-analysis
        elif [ "$targets" != none ]; then
          make external-libs
          # Native, ASAN, and ARM builds cover the real configurations. Bound
          # speculative preprocessor expansion for the affected PR components.
          cppcheck --max-configs=1 -I include --enable=all $targets
        fi
    - name: Test
      shell: bash
      run: |
        GTEST_INCLUDE_DIR=/usr/include make test
    - name: Test with AddressSanitizer
      shell: bash
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
      run: |
        GTEST_INCLUDE_DIR=/usr/include SANITIZE=1 make test
