name: Test build
on:
  pull_request:
    paths-ignore:
      - '**/README.md'
      - 'website/'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test build
    runs-on: ubuntu-latest

    steps:
    - name: Install test dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes build-essential cmake cppcheck libgtest-dev libsdl1.2-dev libsdl-image1.2-dev libsdl-ttf2.0-dev
    - name: Install gtest manually
      run: |
        cd /usr/src/gtest
        sudo cmake CMakeLists.txt && sudo make
        sudo cp /usr/src/gtest/lib/*.a /usr/lib
        sudo ln -s /usr/lib/libgtest.a /usr/local/lib/libgtest.a
        sudo ln -s /usr/lib/libgtest_main.a /usr/local/lib/libgtest_main.a
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    - name: Run static analysis
      run: |
        make static-analysis
    - name: Test
      shell: bash
      run: |
        GTEST_INCLUDE_DIR=/usr/src/gtest/include make test
    - name: Test with AddressSanitizer
      shell: bash
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
      run: |
        GTEST_INCLUDE_DIR=/usr/src/gtest/include SANITIZE=1 make test
