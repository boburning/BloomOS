name: Pre-release

on:
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - '.github/**'
  #     - 'test/**'
  #     - '**/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-release:
    name: Pre-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: aemiii91/miyoomini-toolchain@sha256:e5123590ad75d27f0f4c91196e3119a255cad45f3ae15243e29a8e0a2ec50132
      options: --user root
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Trust checked-out repository
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Get version
      run: |
        echo "BUILD_VERSION=$(make version)" >> $GITHUB_ENV
        echo "SHA_SHORT=$(git log -n 1 --pretty=format:"%h" origin/main)" >> $GITHUB_ENV
    - name: Configure release signing
      env:
        BLOOM_RELEASE_SIGNING_KEY: ${{ secrets.BLOOM_RELEASE_SIGNING_KEY }}
      run: |
        test -n "$BLOOM_RELEASE_SIGNING_KEY"
        umask 077
        printf '%s\n' "$BLOOM_RELEASE_SIGNING_KEY" > /tmp/bloom-release-signing-key.pem
        echo "BLOOM_RELEASE_SIGNING_KEY_FILE=/tmp/bloom-release-signing-key.pem" >> $GITHUB_ENV
    - name: Print version
      run: |
        echo "BloomOS-v${{ env.BUILD_VERSION }}-${{ env.SHA_SHORT }}"
    - name: Build release
      shell: bash
      run: |
        source /root/.bashrc
        VERSION_OVERRIDE=${{ env.BUILD_VERSION }}-${{ env.SHA_SHORT }} CHANNEL=beta make release
    - name: Remove release signing key
      if: always()
      run: rm -f /tmp/bloom-release-signing-key.pem
    - uses: marvinpinto/action-automatic-releases@d68defdd11f9dcc7f52f35c1b7c236ee7513bcc1 # latest resolved 2026-08-15
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        automatic_release_tag: latest
        prerelease: true
        title: "BloomOS v${{ env.BUILD_VERSION }}"
        files: |
          release/${{ env.BUILD_VERSION }}-${{ env.SHA_SHORT }}/*
