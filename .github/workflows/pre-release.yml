name: Pre-release

on:
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - '.github/**'
  #     - 'test/**'
  #     - '**/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-release:
    name: Pre-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: aemiii91/miyoomini-toolchain@sha256:e5123590ad75d27f0f4c91196e3119a255cad45f3ae15243e29a8e0a2ec50132
      options: --user root
    steps:
    - name: Checkout repository
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Git config
      run: |
        git config --global --add safe.directory /__w/Onion/Onion
    - name: Get version
      run: |
        echo "BUILD_VERSION=$(make version)" >> $GITHUB_ENV
        echo "SHA_SHORT=$(git log -n 1 --pretty=format:"%h" origin/main)" >> $GITHUB_ENV
    - name: Print version
      run: |
        echo "Onion-v${{ env.BUILD_VERSION }}-${{ env.SHA_SHORT }}"
    - name: Build release
      shell: bash
      run: |
        source /root/.bashrc
        VERSION_OVERRIDE=${{ env.BUILD_VERSION }}-${{ env.SHA_SHORT }} make release
    - uses: marvinpinto/action-automatic-releases@d68defdd11f9dcc7f52f35c1b7c236ee7513bcc1 # latest resolved 2026-08-15
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        automatic_release_tag: latest
        prerelease: true
        title: "Onion V${{ env.BUILD_VERSION }}"
        files: |
          release/Onion-v${{ env.BUILD_VERSION }}-${{ env.SHA_SHORT }}.zip
