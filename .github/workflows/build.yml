name: Check build
on:
  merge_group:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.gitmodules'
      - 'Makefile'
      - 'src/**/Makefile'
      - 'src/**/*.c'
      - 'src/**/*.h'
      - 'src/**/*.cpp'
      - 'src/**/*.hpp'
      - 'third-party/**'
      - 'tools/checkout-submodules.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check build
    runs-on: ubuntu-latest
    container:
      image: aemiii91/miyoomini-toolchain@sha256:e5123590ad75d27f0f4c91196e3119a255cad45f3ae15243e29a8e0a2ec50132
      options: --user root
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Resolve submodule cache key
      id: submodules
      shell: bash
      run: echo "sha=$(git ls-files --stage | awk '$1 == 160000 { print $2, $4 }' | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - name: Restore submodule object cache
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: .git/modules
        key: submodules-${{ runner.os }}-${{ steps.submodules.outputs.sha }}
    - name: Checkout pinned submodules
      shell: bash
      run: tools/checkout-submodules.sh
    - name: Build
      shell: bash
      run: |
        source /root/.bashrc
        make build
