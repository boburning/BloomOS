name: Shell integration tests

on:
  pull_request:
    paths:
      - '.github/workflows/shell-test.yml'
      - '.github/workflows/hardware-test-build.yml'
      - 'Makefile'
      - 'src/**/*.sh'
      - 'src/bloomLaunch/**'
      - 'src/bloomRa/**'
      - 'src/bloomRaProxy/**'
      - 'src/bloomRaTest/**'
      - 'static/**/*.sh'
      - 'static/build/.tmp_update/bin/*'
      - 'test/shell/**'
      - 'tools/release_metadata.py'
      - 'tools/core_manifest.py'
      - 'tools/provenance_policy.py'
      - 'tools/shell_test_inputs.py'
      - 'tools/legacy_manifest.py'
      - 'build/core-manifest.json'
      - 'build/ra-core-policy.json'
      - 'build/dependencies.lock'
      - 'build/openbor/**'
      - 'build/pixelreader/**'
      - 'build/raofflineproxy/**'
      - 'tools/validate_raofflineproxy_sources.py'
      - 'tools/validate_ra_release_gate.py'
      - 'build/provenance-policy.json'
      - 'build/shell-test-inputs.json'
      - 'build/legacy-manifest.json'
      - 'build/themes.sha256'
      - '.gitmodules'
      - '.gitattributes'
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout shell-test source fixture
        run: git submodule update --init --depth 1 third-party/pixel-reader third-party/zlib third-party/libxml2 third-party/libzip
      - name: Build and run shell tests
        run: make test-shell
