name: Shell integration tests

on:
  pull_request:
    paths:
      - '.github/workflows/shell-test.yml'
      - 'Makefile'
      - 'src/**/*.sh'
      - 'static/**/*.sh'
      - 'static/build/.tmp_update/bin/*'
      - 'test/shell/**'
      - 'tools/release_metadata.py'
      - 'tools/core_manifest.py'
      - 'tools/provenance_policy.py'
      - 'tools/shell_test_inputs.py'
      - 'tools/legacy_manifest.py'
      - 'build/core-manifest.json'
      - 'build/provenance-policy.json'
      - 'build/shell-test-inputs.json'
      - 'build/legacy-manifest.json'
      - 'build/themes.sha256'
      - '.gitmodules'
      - '.gitattributes'
  merge_group:

permissions:
  contents: read

jobs:
  shell-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Build and run shell tests
        run: make test-shell
