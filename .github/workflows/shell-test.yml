name: Shell integration tests

on:
  pull_request:
    paths:
      - '.github/workflows/shell-test.yml'
      - 'Makefile'
      - 'src/**/*.sh'
      - 'static/**/*.sh'
      - 'test/shell/**'
      - 'tools/release_metadata.py'
      - 'build/themes.sha256'
      - '.gitattributes'
  merge_group:

permissions:
  contents: read

jobs:
  shell-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run shell tests
        run: make test-shell
