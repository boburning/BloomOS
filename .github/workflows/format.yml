name: Check formatting

on:
  pull_request:
    paths:
      - 'src/**'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install --yes clang-format
      - name: Check changed source files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            if ! clang-format --dry-run --Werror -style=file "$file"; then
              failed=1
            fi
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- \
            'src/**/*.c' 'src/**/*.h' 'src/**/*.cpp' 'src/**/*.hpp')
          exit "$failed"
