name: Enforce formatting
on:
  pull_request:
    paths:
      - 'src/**'

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
        with:
          # check out HEAD on the branch
          ref: ${{ github.head_ref }}
          # make sure the parent commit is grabbed as well, because
          # that's what will get formatted (i.e. the most recent commit)
          fetch-depth: 2
      - name: Get all src files that have changed
        id: changed-files
        uses: tj-actions/changed-files@2106eb4457dd2aba4d37c8cdd16acba5d18739b9 # v37
        with:
          files_yaml: |
            src:
              - src/**/*.c
              - src/**/*.h
              - src/**/*.cpp
              - src/**/*.hpp
      - name: List all changed src files
        run: |
          for file in ${{ steps.changed-files.outputs.src_all_changed_files }}; do
            echo "$file was changed"
          done
      - name: Apply formatting
        if: steps.changed-files.outputs.src_any_changed == 'true'
        run: |
          sudo apt install clang-format
          for file in ${{ steps.changed-files.outputs.src_all_changed_files }}; do
            echo "clang-format -i '$file'"
            clang-format -style=file -i "$file"
          done
      # commit the changes (if there are any)
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@dd055f6225757c369f948744463f63ac1bd4c277 # v4.1.2
        with:
          commit_message: 🎨 apply clang-format changes
          branch: ${{ github.head_ref }}
